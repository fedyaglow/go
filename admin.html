<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fedya Glow | Administration</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="logo">🌸 Fedya Glow</a>
            <div class="nav-links">
                <a href="index.html" class="nav-link">Accueil</a>
                <a href="produits.html" class="nav-link">Boutique</a>
                <a href="admin.html" class="nav-link">Admin</a>
            </div>
        </div>
    </nav>

    <main class="container" style="padding: 40px 20px;">
        <h1 style="margin-bottom: 30px;">Tableau de Bord ⚙️</h1>

        <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 30px;">
            <!-- Categories Management -->
            <section>
                <div class="admin-card">
                    <h3 style="margin-bottom: 20px;">Gestion des Catégories</h3>
                    <div class="form-group">
                        <label class="form-label">Nom de la nouvelle catégorie</label>
                        <div style="display: flex; gap: 10px;">
                            <input type="text" id="cat-name" class="form-control" placeholder="Ex: Parfums">
                            <button class="btn-primary" onclick="addCategory()">Ajouter</button>
                        </div>
                    </div>
                    <div id="admin-cats-list" style="display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px;">
                        <!-- Categories list -->
                    </div>
                </div>
            </section>

            <!-- Quick Actions -->
            <section>
                <div class="admin-card" style="background: var(--dark); color: white;">
                    <h3>Bienvenue dans votre administration</h3>
                    <p style="margin-top: 10px; opacity: 0.8;">Ici, vous pouvez gérer vos produits, catégories et prix en toute simplicité.</p>
                    <div style="margin-top: 30px;">
                        <a href="edit.html" class="btn-primary" style="text-decoration: none; display: inline-block;">+ Ajouter un Produit</a>
                    </div>
                </div>
            </section>
        </div>

        <h2 style="margin: 40px 0 20px;">Vos Produits</h2>
        <div class="row products-grid" id="admin-products-list">
            <!-- Admin products list -->
        </div>
    </main>

    <script src="main.js"></script>
</body>
</html>
