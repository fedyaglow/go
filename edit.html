<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fedya Glow | Gestion du Produit</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="logo">
                <img src="fedya_glow_logo_1778604528495.png" alt="Fedya Glow Logo" class="logo-img">
            </a>
            <div class="nav-links">
                <a href="index.html" class="nav-link">Accueil</a>
                <a href="produits.html" class="nav-link">Boutique</a>
                <a href="admin.html" class="nav-link">Admin</a>
            </div>
        </div>
    </nav>

    <main class="container" style="padding: 40px 20px;">
        <div style="max-width: 800px; margin: 0 auto;">
            <a href="admin.html" style="text-decoration: none; color: var(--primary); font-weight: 600; display: inline-block; margin-bottom: 20px;">← Retour au tableau de bord</a>
            
            <h1 id="edit-product-title" style="margin-bottom: 30px;">Ajouter / Modifier un Produit</h1>

            <div class="admin-card">
                <input type="hidden" id="prod-id">
                
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    <div class="form-group">
                        <label class="form-label">Nom du Produit (اسم المنتج)</label>
                        <input type="text" id="prod-name" class="form-control" placeholder="Ex: Parfum Rose">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Code Produit (رمز المنتج)</label>
                        <input type="text" id="prod-code" class="form-control" placeholder="P001">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Catégorie (الفئة)</label>
                    <select id="prod-cat" class="form-control">
                        <!-- Categories will be injected here -->
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">Description du Produit (وصف المنتج)</label>
                    <textarea id="prod-desc" class="form-control" rows="4" placeholder="Décrivez votre produit ici..."></textarea>
                </div>

                <div style="margin-top: 40px;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                        <h3 style="margin: 0;">Tailles et Prix (الأحجام والأسعار)</h3>
                        <button class="btn-primary" style="background: var(--dark); padding: 8px 20px;" onclick="addVariantField()">+ Ajouter une taille (إضافة حجم)</button>
                    </div>
                    
                    <div id="variants-container">
                        <!-- Variant rows will be injected here -->
                    </div>
                </div>

                <div style="margin-top: 50px; text-align: right;">
                    <button class="btn-primary" style="padding: 15px 50px; font-size: 1.1rem;" onclick="saveProduct()">Enregistrer le Produit</button>
                </div>
            </div>
        </div>
    </main>

    <script src="main.js"></script>
</body>
</html>
