<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Explorez la boutique Fedya Glow. Une large gamme de produits de beauté, parfums et soins pour tous les styles.">
    <meta property="og:title" content="Fedya Glow | Boutique">
    <meta property="og:description" content="Trouvez vos produits de beauté préférés chez Fedya Glow.">
    <title>Fedya Glow | Boutique</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="logo">
                <img src="logo.jpeg" alt="Fedya Glow Logo" class="logo-img">
            </a>
            <div class="nav-links">
                <a href="index.html" class="nav-link">Accueil</a>
                <a href="produits.html" class="nav-link">Boutique</a>
                <a href="admin.html" class="nav-link"></a>
                <button class="btn-icon" onclick="toggleCart()">
                    <i class="fa-solid fa-bag-shopping"></i>
                    <span class="badge cart-count">0</span>
                </button>
            </div>
        </div>
    </nav>

    <main class="container" style="padding-top: 60px;">
        <h1 class="text-gradient" style="text-align: center; margin-bottom: 40px; font-size: 3.5rem;">Nos Produits</h1>
        
        <div class="search-container" style="max-width: 600px; margin: 0 auto 30px;">
            <div class="form-group" style="position: relative;">
                <i class="fa-solid fa-magnifying-glass" style="position: absolute; left: 20px; top: 50%; transform: translateY(-50%); color: var(--gray-600);"></i>
                <input type="text" id="productSearch" class="form-control" placeholder="Rechercher un produit..." style="padding-left: 50px; border-radius: 100px; height: 55px; box-shadow: var(--shadow-sm);">
            </div>
        </div>

        <div class="category-filters" id="category-filters">
            <!-- Categories will be injected here -->
        </div>

        <div class="products-grid" id="products-grid">
            <!-- Products will be injected here -->
        </div>
    </main>

    <footer class="footer">
        <div class="container footer-content">
            <div class="logo" style="color: white; font-size: 2rem;">🌸 Fedya Glow</div>
            <p>Suivez-nous sur nos réseaux sociaux pour ne rien rater de nos nouveautés.</p>
            <div class="social-links">
                <a href="https://www.facebook.com/profile.php?id=61571002333267" class="social-icon fb"><i class="fa-brands fa-facebook-f"></i></a>
                <a href="https://www.tiktok.com/@fedyfedy946?_r=1&_t=ZN-96RbtunjTJW" class="social-icon tt"><i class="fa-brands fa-tiktok"></i></a>
                <a href="https://www.instagram.com/fedya_glow" class="social-icon ig"><i class="fa-brands fa-instagram"></i></a>
            </div>
            <div class="footer-bottom">
                &copy; 2024 Fedya Glow. Tous droits réservés.
            </div>
        </div>
    </footer>

    <!-- Floating Buttons -->
    <div class="floating-btn-group">
        <a href="https://wa.me/33695198708" class="floating-btn btn-wa" target="_blank">
            <i class="fa-brands fa-whatsapp"></i>
        </a>
        <div class="floating-btn btn-cart" onclick="toggleCart()">
            <i class="fa-solid fa-cart-shopping"></i>
            <span class="badge cart-count">0</span>
        </div>
    </div>

    <!-- Sidebar Cart -->
    <div class="overlay" id="overlay" onclick="toggleCart()"></div>
    <div class="cart-sidebar" id="cartSidebar">
        <div class="cart-header">
            <h3>Votre Panier 🛍️</h3>
            <button class="btn-icon" onclick="toggleCart()" style="font-size: 1.2rem;">✕</button>
        </div>
        <div class="cart-items" id="cart-items-container">
            <!-- Items will be injected here -->
        </div>
        <div class="cart-footer">
            <div class="cart-total">
                <span>Total:</span>
                <span id="cart-total-amount">0.00 €</span>
            </div>
            <button class="checkout-btn" onclick="sendWhatsApp()">
                Commander via WhatsApp
                <i class="fa-brands fa-whatsapp"></i>
            </button>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
